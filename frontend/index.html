<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svg/queueless-favicon.svg" />
    <link rel="alternate icon" href="/png/favicon-32.png" />
    <link rel="apple-touch-icon" href="/png/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueueLess - take a digital token, watch your queue position live, walk in only when it's your turn." />
    <meta name="theme-color" content="#F7F3EC" />
    <title>QueueLess — Smart Queue Management</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes
      // light. Same rule as ThemeContext: no saved choice follows the device.
      (function () {
        try {
          var saved = localStorage.getItem('queueless.theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1C1A18');
          }
        } catch (e) { /* storage blocked: stay light */ }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
